<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Báo cáo ASR MT Y khoa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one fixed 1920x1080 stage scaled to the window, nothing scrolls; surgical-scrub teal against cool chart paper, amber = ASR, blue = MT. */
:root{
  color-scheme:dark;
  --scrub:#0A3A42;--scrub-2:#0F4E57;--scrub-3:#1A6771;
  --paper:#E4EEEB;--paper-2:#CFE0DC;--sheet:#F3F8F6;
  --ink:#08262C;--ink-2:#3B5A5E;--on:#E8F3F0;--on-2:#AFCFCB;
  --asr:#FFB21A;--asr-s:#CF8700;--asr-t:#FFD27A;--asr-ink:#8F5200;
  --mt:#3F80F2;--mt-s:#2858B8;--mt-t:#86AEF7;--mt-ink:#1B4BAE;
  --n:#7E9C9B;--n-s:#5C7877;--n-t:#A9C2C0;
  --harm:#BC1F45;--harm-t:#FFB3C2;
  --disp:'Be Vietnam Pro','Segoe UI',Arial,sans-serif;
  --body:'Be Vietnam Pro','Segoe UI',Arial,sans-serif;
  --mono:'IBM Plex Mono',Consolas,monospace;
  --mx:0;--my:0;
}
html,body{height:100%;margin:0;overflow:hidden;background:#061F24;color:var(--on);font-family:var(--body)}
#deck{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--scrub)}
#stage{position:absolute;inset:0;perspective:2600px;perspective-origin:50% 50%}
section{position:absolute;inset:0;box-sizing:border-box;padding:64px 96px 88px;display:none;flex-direction:column;gap:30px;backface-visibility:hidden;overflow:hidden}
section.on,section.mv{display:flex}
section.lt{background:var(--paper);color:var(--ink)}
section.dk{background:var(--scrub);color:var(--on)}
.hd{display:flex;flex-direction:column;gap:8px;flex:none}
.k{font:500 22px/1.2 var(--mono);letter-spacing:.04em;color:var(--ink-2)}
.dk .k{color:var(--on-2)}
h1,h2,h3,p{margin:0}
h2{font:700 60px/1.08 var(--disp);letter-spacing:-.01em;max-width:1640px;text-wrap:balance}
h3{font:700 34px/1.2 var(--disp)}
p,li{font-size:29px;line-height:1.42}
.sm{font-size:26px;line-height:1.4}
.mut{color:var(--ink-2)}.dk .mut{color:var(--on-2)}
ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.bd{flex:1;min-height:0;display:flex;gap:44px;align-items:stretch}
.col{display:flex;flex-direction:column;gap:22px;min-width:0;justify-content:center}
.bd.v{flex-direction:column;justify-content:center;gap:34px}
.g1{flex:1}.g2{flex:2}.g3{flex:3}
b.a{color:var(--asr-ink);font-weight:700}.dk b.a{color:var(--asr)}
b.m{color:var(--mt-ink);font-weight:700}.dk b.m{color:var(--mt-t)}
b.h{color:var(--harm);font-weight:700}.dk b.h{color:var(--harm-t)}
.num{font:800 92px/1 var(--disp);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;gap:4px}

/* 3D table */
.tilt{perspective:1900px;perspective-origin:40% 30%;width:100%}
.slab{--d:24px;position:relative;transform-style:preserve-3d;background:var(--sheet);color:var(--ink);transform:rotateX(calc(7deg + var(--my)*2.5deg)) rotateY(calc(-6deg + var(--mx)*3.5deg));transform-origin:50% 50%;box-shadow:0 34px 44px -22px rgba(4,30,35,.5)}
.slab .e{position:absolute;display:block;background:var(--paper-2)}
.slab .e.r{top:0;bottom:0;left:100%;width:var(--d);background:#9DB8B4;transform-origin:0 50%;transform:rotateY(90deg)}
.slab .e.b{left:0;right:0;top:100%;height:var(--d);background:#B6CDC9;transform-origin:50% 0;transform:rotateX(-90deg)}
.tr{display:grid;align-items:center;transform-style:preserve-3d;border-bottom:1px solid #C5D7D3;position:relative;background:var(--sheet)}
.tr>div{padding:18px 22px;font-size:29px;line-height:1.25;min-width:0}
.tr>div.r{text-align:right;font-variant-numeric:tabular-nums}
.tr.th{background:var(--scrub);color:var(--on);transform:translateZ(14px);border:0}
.tr.th>div{font:500 23px/1.2 var(--mono)}
.tr.hi{background:var(--asr);color:var(--ink);font-weight:700;transform:translateZ(30px);box-shadow:0 14px 22px -8px rgba(4,30,35,.45);border:0}
.tr.hm{background:var(--mt);color:#fff;font-weight:600;transform:translateZ(30px);box-shadow:0 14px 22px -8px rgba(4,30,35,.45);border:0}
.dk .slab{box-shadow:0 34px 50px -18px rgba(0,0,0,.6)}

/* 3D scene */
.scene{position:relative;perspective:2400px;perspective-origin:68% 10%;display:flex;align-items:center;justify-content:center}
.wd{transform-style:preserve-3d;flex:none;transform:scale(var(--sc,1)) rotateX(calc(-13deg + var(--my)*2.5deg)) rotateY(calc(-20deg + var(--mx)*4deg));display:flex;align-items:flex-end;gap:var(--gap,34px);position:relative}
.floor{position:absolute;left:-46px;right:-46px;bottom:-1px;height:260px;transform-origin:50% 100%;transform:rotateX(90deg);background:repeating-linear-gradient(90deg,rgba(8,38,44,.13) 0 2px,transparent 2px 60px),repeating-linear-gradient(0deg,rgba(8,38,44,.13) 0 2px,transparent 2px 60px),var(--paper-2)}
.dk .floor{background:repeating-linear-gradient(90deg,rgba(232,243,240,.1) 0 2px,transparent 2px 60px),repeating-linear-gradient(0deg,rgba(232,243,240,.1) 0 2px,transparent 2px 60px),var(--scrub-2)}
.b3{position:relative;transform-style:preserve-3d;transform-origin:50% 100%;flex:none;width:var(--w);height:var(--h)}
.b3 i{position:absolute;display:block;backface-visibility:hidden}
.b3 .f{inset:0;background:var(--f);transform:translateZ(calc(var(--d)/2))}
.b3 .s{top:0;bottom:0;left:calc((var(--w) - var(--d))/2);width:var(--d);background:var(--s);transform:rotateY(90deg) translateZ(calc(var(--w)/2))}
.b3 .t{left:0;right:0;top:calc(var(--d)/-2);height:var(--d);background:var(--t);transform:rotateX(90deg)}
.c-a{--f:var(--asr);--s:var(--asr-s);--t:var(--asr-t)}
.c-m{--f:var(--mt);--s:var(--mt-s);--t:var(--mt-t)}
.c-n{--f:var(--n);--s:var(--n-s);--t:var(--n-t)}
.c-d{--f:var(--scrub-3);--s:var(--scrub);--t:#3A8791}
.lb{position:absolute;left:50%;top:calc(100% + 12px);width:calc(var(--w) + 30px);margin-left:calc((var(--w) + 30px)/-2);text-align:center;font:500 22px/1.15 var(--mono);transform:translateZ(calc(var(--d)/2 + 2px))}
.vl{position:absolute;left:50%;bottom:calc(100% + var(--d)*.42);transform:translateX(-50%) translateZ(calc(var(--d)/2));font:800 32px/1 var(--disp);white-space:nowrap;font-variant-numeric:tabular-nums}

/* blocks */
.blk{--w:230px;--h:190px;--d:70px}
.blk .bt{position:absolute;inset:0;transform:translateZ(calc(var(--d)/2 + 1px));display:flex;flex-direction:column;justify-content:center;gap:6px;padding:14px 16px;box-sizing:border-box;color:var(--ink);backface-visibility:hidden}
.blk.c-m .bt,.blk.c-d .bt{color:#fff}
.blk .bt b{font:800 33px/1.08 var(--disp)}
.blk .bt span{font:500 22px/1.2 var(--mono)}
.ar{flex:none;align-self:center;width:58px;height:22px;position:relative;transform:translateZ(38px)}
.ar:before{content:"";position:absolute;left:0;right:12px;top:9px;height:4px;background:currentColor}
.ar:after{content:"";position:absolute;right:0;top:0;border-left:16px solid currentColor;border-top:11px solid transparent;border-bottom:11px solid transparent}

/* layer stacks */
.st{position:relative;transform-style:preserve-3d;width:var(--w);height:var(--h);flex:none}
.st i{position:absolute;inset:0;display:block;border:2px solid rgba(232,243,240,.6);background:var(--f);transform:translateZ(calc(var(--k)*-13px))}
.st .fc{position:absolute;inset:0;padding:18px 20px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:8px;transform:translateZ(1px);color:#fff}
.st .fc b{font:800 34px/1.05 var(--disp)}
.st .fc span{font:500 21px/1.25 var(--mono)}
.st.c-a .fc{color:var(--ink)}

/* tiles */
.tiles{display:grid;gap:20px}
.tile{background:var(--sheet);color:var(--ink);padding:20px 22px;justify-content:center;display:flex;flex-direction:column;gap:6px;box-shadow:7px 7px 0 var(--paper-2),8px 8px 0 #9DB8B4}
.dk .tile{background:var(--scrub-2);color:var(--on);box-shadow:7px 7px 0 #082F36}
.tile b{font:700 31px/1.15 var(--disp)}
.tile span{font-size:25px;line-height:1.34}
.tile em{font:500 21px/1.1 var(--mono);font-style:normal;color:var(--ink-2)}
.dk .tile em{color:var(--on-2)}
.note{background:var(--scrub);color:var(--on);padding:22px 26px;font-size:27px;line-height:1.38}
.dk .note{background:var(--scrub-2)}
.verdict{background:var(--asr);color:var(--ink);padding:18px 26px;font:800 42px/1.1 var(--disp)}
.hb{display:grid;grid-template-columns:var(--lw,250px) 1fr;gap:10px 14px;align-items:center}
.hb .nm{font-size:25px;line-height:1.15}
.hb .tk{height:40px;position:relative}
.hb .fl{position:absolute;left:0;top:0;bottom:0;background:var(--scrub-3);box-shadow:6px 6px 0 #9DB8B4;transform-origin:0 50%}
.hb .fl.ac{background:var(--asr)}
.hb .tx{position:absolute;top:50%;transform:translateY(-50%);font:700 23px/1 var(--body);font-variant-numeric:tabular-nums;padding-left:16px}
mark{background:rgba(188,31,69,.17);color:var(--harm);font-weight:700;padding:0 4px}
.dk mark{background:rgba(255,179,194,.17);color:var(--harm-t)}
ins{text-decoration:none;font-weight:700;color:var(--asr-ink)}
.dk ins{color:var(--asr)}

/* agenda */
.ag{display:grid;grid-template-columns:1fr;gap:0;flex:1}
.ag button{all:unset;cursor:pointer;display:grid;grid-template-columns:110px 1fr 170px;align-items:center;border-top:2px solid rgba(8,38,44,.25);padding:0 10px;transition:padding .25s,background .25s}
.ag button:last-child{border-bottom:2px solid rgba(8,38,44,.25)}
.ag button:hover,.ag button:focus-visible{background:var(--paper-2);padding-left:30px}
.ag .r{font:800 58px/1 var(--disp);color:var(--scrub-3)}
.ag .t{font:600 34px/1.2 var(--body)}
.ag .p{font:500 24px/1 var(--mono);text-align:right;color:var(--ink-2)}

/* cover */
.cv{padding:0}
.cv canvas{position:absolute;inset:0;width:100%;height:100%}
.cv .ct{position:absolute;left:96px;top:70px;right:96px;display:flex;flex-direction:column;gap:18px}
.cv h1{font:800 96px/1.02 var(--disp);letter-spacing:-.015em;max-width:1480px;text-wrap:balance}
.cv .sb{font-size:32px;line-height:1.3;color:var(--on-2);max-width:1300px}
.cv .ft{position:absolute;left:96px;right:96px;bottom:66px;display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
.cv .ft p{font-size:25px;line-height:1.4}
.cv .cap{position:absolute;right:96px;top:296px;width:470px;text-align:right;font:400 20px/1.35 var(--mono);color:var(--on-2)}

/* entry */
.live .tr{animation:rowIn .55s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--bd,0ms) + var(--i)*48ms)}
.live .b3:not(.blk){animation:grow .75s cubic-bezier(.2,.9,.25,1) backwards;animation-delay:calc(var(--bd,0ms) + var(--i)*70ms)}
.live .rise{animation:riseIn .6s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--bd,0ms) + var(--i,0)*80ms)}
.live .fl{animation:wide .7s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--bd,0ms) + var(--i,0)*60ms)}
@keyframes rowIn{from{opacity:0;transform:translateZ(120px) translateY(14px)}}
@keyframes grow{from{transform:scaleY(.03)}}
@keyframes riseIn{from{opacity:0;transform:translateY(26px)}}
@keyframes wide{from{transform:scaleX(.02)}}

/* hud */
#hud{position:absolute;right:40px;bottom:22px;display:flex;align-items:center;gap:10px;z-index:30;font:500 22px/1 var(--mono);color:var(--ink);mix-blend-mode:normal}
#hud.dk{color:var(--on)}
#hud button{all:unset;cursor:pointer;width:44px;height:44px;display:grid;place-items:center;font:500 28px/1 var(--mono);border:2px solid currentColor;color:inherit}
#hud button:hover{background:var(--asr);color:var(--ink);border-color:var(--asr)}
#hud button:focus-visible{outline:3px solid var(--asr);outline-offset:2px}
#cnt{min-width:96px;text-align:center}
#pg{position:absolute;left:0;bottom:0;height:8px;background:var(--asr);z-index:30;transition:width .5s}
#sw{position:absolute;inset:0;z-index:25;pointer-events:none;display:none;flex-direction:column}
#sw i{flex:1;display:block;transform:translateX(-101%)}
@media (prefers-reduced-motion:reduce){.live *,.live *::before,.live *::after{animation:none!important}}

/* Typography and spacing. */
:root{--paper:#F3F4EF;--paper-2:#E4E9E2;--sheet:#FFFFFF;--ink:#142F32;--ink-2:#536865;--asr:#F2B844;--asr-ink:#8A5707;--on-2:#BBD1CC}
html,body{background:#10292D}
section{padding:60px 88px 100px;gap:32px}
section::after{content:"";position:absolute;left:88px;right:88px;bottom:76px;height:1px;background:rgba(20,47,50,.16)}
section.dk::after{background:rgba(232,243,240,.2)}
.hd{gap:16px;padding-bottom:24px;border-bottom:1px solid rgba(20,47,50,.18)}
.dk .hd{border-color:rgba(232,243,240,.2)}
.k{font:500 21px/1.25 var(--body);letter-spacing:.03em}
h2{font-size:52px;line-height:1.22;letter-spacing:-.035em;max-width:1680px;text-wrap:wrap}
h3{font-size:30px;line-height:1.3;letter-spacing:-.025em}
p,li{font-size:28px;line-height:1.5}
.sm{font-size:25px;line-height:1.48}
.bd{gap:40px}
.col{gap:22px}
.num{font-size:76px;line-height:1.12;font-weight:700;letter-spacing:-.055em;white-space:nowrap}
.num.range{font-size:58px}
.tilt{perspective:2200px;perspective-origin:50% 40%}
.slab{transform:scale(.975) rotateX(calc(5deg + var(--my)*2deg)) rotateY(calc(-4deg + var(--mx)*3deg));box-shadow:0 35px 55px -25px #08262C66;border:1px solid #CCD7D0;border-radius:8px;overflow:visible}
.slab .e{display:block}
.tr{border-bottom:1px solid #DFE5DF}
.tr:last-of-type{border-bottom:0}
.tr>div{padding:18px 20px;font-size:27px;line-height:1.34}
.tr.th{background:var(--scrub);color:var(--on);transform:translateZ(12px);border-radius:8px 8px 0 0}
.tr.th>div{font:600 22px/1.35 var(--body)}
.tr.hi{background:#F4C45F;box-shadow:0 13px 20px -13px #08262C99;color:var(--ink);transform:translateZ(24px)}
.tr.hm{background:#3F80F2;box-shadow:0 13px 20px -13px #08262C99;color:white;transform:translateZ(24px)}
.dk .slab{box-shadow:0 38px 60px -22px #00191FCC}
.tile{padding:22px 24px;border:1px solid #D6DED5;border-radius:10px;box-shadow:0 14px 25px -21px #08262C80,4px 5px 0 #D5DFD6;gap:10px}
.tile b{font-size:28px;line-height:1.28;letter-spacing:-.025em}
.tile span{font-size:24px;line-height:1.45}
.tile em{font:500 19px/1.3 var(--body);letter-spacing:.02em}
.dk .tile{background:linear-gradient(135deg,#15515B,#10434B);border-color:#32616A;box-shadow:0 20px 35px -24px #000C12CC,4px 5px 0 #072E35}
.note{padding:24px 28px;font-size:25px;line-height:1.5;border-left:4px solid var(--asr);border-radius:0 8px 8px 0}
.verdict{background:#F9EAC5;color:var(--ink);padding:24px;font:700 34px/1.35 var(--disp);border-radius:10px}
.hb .nm{font-size:24px}
.hb .tk{height:36px}
.hb .fl{box-shadow:5px 6px 0 #A8BEB7;border-radius:0 4px 4px 0}
.hb .tx{font-size:22px}
#s22 .bd.v{gap:24px}
#s22 .tr>div{padding-top:16px;padding-bottom:16px}
#s22 .bd.v>.bd{margin-top:8px!important}
.ag button{grid-template-columns:110px 1fr 150px;border-width:1px;padding:0 16px}
.ag button:last-child{border-width:1px}
.ag .r{font-size:48px;font-weight:600}
.ag .t{font-size:32px;font-weight:500;letter-spacing:-.02em}
.ag .p{font-size:22px}
.ag button:hover,.ag button:focus-visible{padding-left:28px;background:#E8EDE5}
.cv .ct{left:88px;right:88px;top:76px;gap:24px}
.cv h1{font-size:92px;line-height:1.18;font-weight:700;letter-spacing:-.045em;max-width:1570px;text-wrap:wrap}
.cv .sb{font-size:30px;line-height:1.4;max-width:1400px}
.cv .cap{top:auto;bottom:182px;right:88px;width:470px;font:400 19px/1.5 var(--body);text-align:right}
.cv .ft{left:88px;right:88px;bottom:102px}
.cv .ft p{font-size:22px;line-height:1.6}
.floor{opacity:.65}
.wd{transform:scale(var(--sc,1)) rotateX(calc(-12deg + var(--my)*3deg)) rotateY(calc(-18deg + var(--mx)*4deg))}
.live .tr{animation:rowIn .7s cubic-bezier(.16,1,.3,1) backwards;animation-delay:calc(var(--bd,0ms) + var(--i)*65ms)}
.live .rise{animation:riseIn .7s cubic-bezier(.16,1,.3,1) backwards;animation-delay:calc(var(--bd,0ms) + var(--entry,0)*65ms)}
.b3 .f{box-shadow:inset 1px 1px 0 #FFFFFF45,inset -1px -1px 0 #08262C26}
.b3 .t{box-shadow:inset 0 1px 0 #FFFFFF50}
.b3 .s{box-shadow:inset -1px 0 0 #00000020}
.st i{box-shadow:0 0 0 1px #FFFFFF0A}
.live .blk,.live .st{animation:moduleIn .85s cubic-bezier(.16,1,.3,1) backwards;animation-delay:calc(var(--bd,0ms) + var(--entry,0)*90ms)}
.live .ar:before{background:linear-gradient(90deg,currentColor 0 25%,#FFFFFF 48%,currentColor 72% 100%);background-size:220% 100%;animation:signalFlow 2.6s linear infinite}
.live .cv-title,.cv.live .ct{animation:coverIn 1s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--bd,0ms)}
.cv canvas{transform:translate3d(calc(var(--mx)*14px),calc(var(--my)*10px),0);transform-origin:50% 70%}
section.cv{background:radial-gradient(ellipse at 78% 65%,#15515B 0,transparent 64%),var(--scrub)}
.live .hd{animation:headingIn .75s cubic-bezier(.16,1,.3,1) backwards;animation-delay:var(--bd,0ms)}
@keyframes moduleIn{from{opacity:0;transform:translate3d(0,55px,-110px) rotateX(-12deg)}to{opacity:1;transform:translate3d(0,0,0) rotateX(0deg)}}
@keyframes signalFlow{from{background-position:220% 0}to{background-position:0 0}}
@keyframes coverIn{from{opacity:0;transform:perspective(1800px) translate3d(0,32px,-80px) rotateX(6deg)}to{opacity:1;transform:perspective(1800px) translate3d(0,0,0) rotateX(0deg)}}
@keyframes headingIn{from{opacity:0;transform:translate3d(0,18px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
#deck-label{position:absolute;left:88px;bottom:28px;z-index:30;font:500 18px/1.2 var(--body);letter-spacing:.03em;color:var(--ink-2);pointer-events:none}
#deck-label.dk{color:var(--on-2)}
#hud{right:88px;bottom:20px;gap:12px;font:500 19px/1 var(--body)}
#hud button{width:40px;height:36px;border:1px solid rgba(83,104,101,.4);border-radius:6px;font-size:25px}
#hud.dk button{border-color:rgba(187,209,204,.35)}
#cnt{min-width:76px;font-variant-numeric:tabular-nums}
#pg{height:3px;transition:width .25s ease}
@media print{
  @page{size:1920px 1080px;margin:0}
  html,body{height:auto;overflow:visible;background:white;print-color-adjust:exact;-webkit-print-color-adjust:exact}
  #deck{position:static;width:1920px;height:auto;transform:none!important;overflow:visible}
  #stage{position:static;perspective:none}
  section,section.on,section.mv{position:relative;display:flex!important;width:1920px;height:1080px;break-after:page;page-break-after:always}
  #hud,#pg,#sw,#deck-label{display:none}
  .live *{animation:none!important}
  .slab,.wd,.cv canvas{transform:none!important}
  .tr.th,.tr.hi,.tr.hm{transform:none;box-shadow:none}
  .slab .e{display:none}
}
</style>
</head>
<body>
<div id="deck"><div id="stage"></div><div id="sw"></div><div id="pg"></div>
<div id="deck-label">Nhóm 2 · ASR &amp; MT</div>

function curves(){
  const W=800,H=430,L=66,B=52,T=14,R=14,X=x=>L+x/2800*(W-L-R),Y=y=>T+(1-Math.min(y,40)/40)*(H-T-B);
  const col={V1:'#BC1F45',V3:'#0F4E57',V4:'#7E9C9B',V5:'#CF8700'};
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="WER trên DEV-subset theo bước huấn luyện của V1, V3, V4, V5">`;
  for(const y of [0,10,20,30,40])s+=`<line x1="${L}" x2="${W-R}" y1="${Y(y)}" y2="${Y(y)}" stroke="#B7CCC8"/><text x="${L-12}" y="${Y(y)+7}" text-anchor="end" font-size="21" fill="#3B5A5E" font-family="IBM Plex Mono,monospace">${y}</text>`;
  for(const x of [0,1000,2000])s+=`<text x="${X(x)}" y="${H-16}" text-anchor="middle" font-size="21" fill="#3B5A5E" font-family="IBM Plex Mono,monospace">${x.toLocaleString('de-DE')}</text>`;
  for(const k of ['V4','V3','V5','V1']){
    const pts=D.curves[k];
    s+=`<polyline fill="none" stroke="${col[k]}" stroke-width="${k=='V1'?4:3.5}" points="${pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')}"/>`;
    

  }
  s+=`<text x="${X(1040)}" y="${Y(36.6)}" font-size="23" fill="#BC1F45" font-family="Be Vietnam Pro,sans-serif">V1 vọt tới 320%, trục cắt ở 40</text>`;
  ['V1','V3','V4','V5'].forEach((k,i)=>{const nm=k=='V5'?'V6':k;const x=X(1040)+i*104;s+=`<rect x="${x}" y="${Y(29)-12}" width="30" height="7" fill="${col[k]}"/><text x="${x+38}" y="${Y(29)}" font-size="23" font-weight="700" fill="#08262C" font-family="Be Vietnam Pro,sans-serif">${nm}</text>`});
  s+=`</svg>`;
  return s;
}
function forest(){
  const W=860,H=340,L=20,R=30,sc=x=>L+(x+2)/20*(W-L-R);
  const rows=[['WER',.30,-.63,1.14,'#7E9C9B','+0,30'],['Recall, khớp nguyên từ',9.53,4.39,14.69,'#FFB21A','+9,53'],['Recall, khớp chuỗi con',10.91,6.25,15.83,'#FFB21A','+10,91']];
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Khoảng tin cậy 95% của DiD cho WER và recall thuật ngữ">`;
  for(const x of [0,5,10,15])s+=`<line x1="${sc(x)}" x2="${sc(x)}" y1="16" y2="${H-40}" stroke="${x?'#3A7A83':'#E8F3F0'}" stroke-width="${x?1.5:3}"/><text x="${sc(x)}" y="${H-10}" text-anchor="middle" font-size="22" fill="#AFCFCB" font-family="IBM Plex Mono,monospace">${x?'+'+x:0}</text>`;
  rows.forEach((r,i)=>{const y=70+i*88;
    s+=`<text x="${i?sc(r[2]):sc(r[3])+24}" y="${i?y-22:y+6}" font-size="25" fill="#E8F3F0" font-family="Be Vietnam Pro,sans-serif">${r[0]}: ${r[5]}</text>`;
    s+=`<rect x="${sc(r[2])+7}" y="${y-5}" width="${sc(r[3])-sc(r[2])}" height="18" fill="#04262C"/><rect x="${sc(r[2])}" y="${y-11}" width="${sc(r[3])-sc(r[2])}" height="18" fill="${r[4]}"/><circle cx="${sc(r[1])}" cy="${y-2}" r="11" fill="#E8F3F0" stroke="#0A3A42" stroke-width="3"/>`});
  return s+`</svg>`;
}

{dk:1,cv:1,h:`<canvas data-mel width="1920" height="1080" aria-label="Log-mel của một clip thật"></canvas><div class="ct"><h1 style="font-size:116px;max-width:1350px">Cảm ơn thầy cô và các bạn</h1><p class="sb">Trao đổi và thảo luận</p></div>`}
];

/* build */
const stage=$('#stage');
S.forEach((s,i)=>{const e=document.createElement('section');e.className=(s.dk?'dk':'lt')+(s.cv?' cv':'');e.id='s'+(i+1);e.setAttribute('aria-label','Slide '+(i+1));e.innerHTML=s.h;stage.append(e)});
const sec=$$('section'),N=sec.length;

/* cover terrain from a real log-mel */
function terrain(c,prog){
  const g=c.getContext('2d'),{f,t,v}=D.mel,W=c.width,HH=c.height;
  g.clearRect(0,0,W,HH);
  const x0=290,dx=(W-x0-30)/t,top=470,gap=11,sk=-5.2,amp=150,cut=Math.floor(t*prog);
  for(let r=f-1;r>=0;r--){
    const by=top+(f-1-r)*gap,ox=x0+(f-1-r)*sk;
    g.beginPath();g.moveTo(ox,by+40);
    for(let k=0;k<=cut&&k<t;k++){g.lineTo(ox+k*dx,by-Math.pow(v[r*t+k]/99,2.3)*amp)}
    g.lineTo(ox+Math.min(cut,t-1)*dx,by+40);g.closePath();
    g.fillStyle='#0A3A42';g.fill();
    for(let k=1;k<=cut&&k<t;k++){
      const a=v[r*t+k]/99,y0=by-Math.pow(v[r*t+k-1]/99,2.3)*amp,y1=by-Math.pow(a,2.3)*amp;

function playTerrain(sc){const c=$('canvas[data-mel]',sc);if(!c)return;

window.TR_NAMES=TR.map(f=>f(1).n);


let cur=0,busy=false;const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const hud=$('#hud'),cnt=$('#cnt'),pg=$('#pg'),sw=$('#sw');
const swc=['#FFB21A','#0F4E57','#3F80F2','#1A6771','#FFD27A','#0A3A42','#86AEF7','#CF8700'];
sw.innerHTML=swc.map(c=>`<i style="background:${c}"></i>`).join('');
function mark(i){cnt.textContent=(i+1)+' / '+N;pg.style.width=((i+1)/N*100)+'%';hud.classList.toggle('dk',!!S[i].dk);$('#deck-label').classList.toggle('dk',!!S[i].dk);try{history.replaceState(null,'','#s'+(i+1))}catch(e){}}
function enter(e,delay){$$('.rise,.blk,.st',e).forEach((node,i)=>node.style.setProperty('--entry',i));e.style.setProperty('--bd',delay+'ms');e.classList.remove('live');void e.offsetWidth;e.classList.add('live');playTerrain(e)}
function show(i){sec.forEach((s,k)=>{s.classList.toggle('on',k==i);s.classList.remove('mv');s.style.zIndex=k==i?2:0});cur=i;mark(i);enter(sec[i],60)}
async function go(n){
  if(busy||n==cur||n<0||n>=N)return;busy=true;
  const a=sec[cur],b=sec[n],d=n>cur?1:-1,ti=(d>0?cur:n)%TR.length,t=TR[ti](d),ms=reduce?180:t.ms,ease=t.ease||'cubic-bezier(.65,.02,.3,1)',A=[];
  b.classList.add('mv');a.classList.add('mv');a.classList.remove('live');
  a.style.zIndex=t.top=='o'?3:2;b.style.zIndex=t.top=='o'?2:3;
  enter(b,reduce?0:Math.round(ms*.55));
  const opt={duration:ms,easing:ease,fill:'both'};
  if(reduce){A.push(a.animate([{opacity:1},{opacity:0}],opt),b.animate([{opacity:0},{opacity:1}],opt))}
  else if(t.sweep){
    sw.style.display='flex';const bars=$$('i',sw);

}
function fit(){const dk=$('#deck'),s=Math.min(innerWidth/1920,innerHeight/1080);dk.style.transform=`scale(${s}) translate(-50%,-50%)`}
addEventListener('resize',fit);fit();
$('#nx').onclick=e=>{e.stopPropagation();go(cur+1)};$('#pv').onclick=e=>{e.stopPropagation();go(cur-1)};

$$('[data-go]').forEach(b=>b.onclick=e=>{e.stopPropagation();go(+b.dataset.go-1)});

  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(k)&&!(k=='Enter'&&e.target.closest?.('button'))&&!(k==' '&&e.target.closest?.('button'))){e.preventDefault();go(cur+1)}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){e.preventDefault();go(cur-1)}
  else if(k=='Home')go(0);else if(k=='End')go(N-1);else if(k=='f'||k=='F')$('#fs').click()});

let wt=0;addEventListener('wheel',e=>{const n=Date.now();if(n-wt<1100||Math.abs(e.deltaY)<12)return;wt=n;go(cur+(e.deltaY>0?1:-1))},{passive:true});

if(!reduce&&matchMedia('(hover:hover) and (pointer:fine)').matches){
  const root=document.documentElement.style;
  let targetX=0,targetY=0,x=0,y=0,frame=0;
  function parallax(){
    x+=(targetX-x)*.12;y+=(targetY-y)*.12;
    root.setProperty('--mx',x.toFixed(4));root.setProperty('--my',y.toFixed(4));
    if(Math.abs(targetX-x)+Math.abs(targetY-y)>.001)frame=requestAnimationFrame(parallax);else frame=0;
  }
  function aim(mx,my){targetX=mx;targetY=my;if(!frame)frame=requestAnimationFrame(parallax)}
  $('#deck').addEventListener('pointermove',e=>{const r=$('#deck').getBoundingClientRect();aim((e.clientX-r.left)/r.width-.5,(e.clientY-r.top)/r.height-.5)},{passive:true});
  $('#deck').addEventListener('pointerleave',()=>aim(0,0),{passive:true});
}

function fromHash(){const m=location.hash.match(/^#s?(\d+)$/);return m?Math.min(N,Math.max(1,+m[1]))-1:0}
